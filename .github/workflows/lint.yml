# Fails the pull request if `usagi lint` reports anything or `usagi format`
# would change any file. To make this blocking, mark the "Lint & format" check
# as required in the branch protection rules for the default branch.

name: Lint

on:
  pull_request:
  push:
    branches: [master]

env:
  USAGI_VERSION: 0.5.0

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: false

    - name: Install usagi
      run: |
        name="usagi-v${USAGI_VERSION}-x86_64-unknown-linux-musl"
        curl -sSfL "https://github.com/DarklightGames/usagi/releases/download/v${USAGI_VERSION}/${name}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

    - name: Lint
      run: usagi lint --format=concise

    - name: Check formatting
      run: usagi format --check

<!-- #include file="header.inc" -->
  <table width="400px" class="crud-table">
    <thead>
      <tr>
        <th>Player ID</th>
        <th class="check">Messages</th>
        <th class="check">Voice</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <%ItemList%>
    </tbody>
    <tfoot>
      <tr>
        <form method="post" action="<%PostAction%>">
          <td><input class="textbox playerid" type="text" pattern="^[0-9]{17}$" maxlength="17" name="PlayerID" title="SteamID64 (17-digit Steam ID)" required></td>
          <td class="check"><input class="check" type="checkbox" name="OutMsg"></td>
          <td class="check"><input class="check" type="checkbox" name="OutVoice"></td>
          <td><input class="button create" type="submit" name="Update" value="Create"></td>
        </form>
      </tr>
    </tfoot>
  </table>
<!-- #include file="footer.inc" -->
